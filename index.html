<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AI4Protein: open-source tools for protein science, structure prediction, design, and analysis.">
    <title>Tools | AI4Protein</title>
    <link rel="icon" href="assets/images/avatar.jpeg">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script type="module" src="assets/js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="header-inner container">
        <a class="brand" href="./" aria-label="AI4Protein home">
          <img src="assets/images/avatar.jpeg" width="40" height="40" alt="">
          <span>AI4Protein</span>
        </a>
        <button class="icon-button menu-button" type="button" aria-label="Open navigation" title="Open navigation" aria-expanded="false" aria-controls="primary-navigation">
          <span class="menu-icon" aria-hidden="true"></span>
        </button>
        <nav id="primary-navigation" class="primary-navigation" aria-label="Primary">
          <a href="./" aria-current="page">Tools</a>
          <a href="papers/">Papers</a>
          <a href="molecules/">Molecules</a>
          <a href="structure-prediction/">Structure Prediction</a>
          <a href="design/">Design</a>
          <a href="property/">Property</a>
        </nav>
      </div>
    </header>

    <main id="main" class="container tools-page">
      <section class="catalog-heading" aria-labelledby="page-heading">
        <p class="eyebrow">Tools</p>
        <h1 id="page-heading">Open-source tools for protein science</h1>
        <div class="search-field" role="search">
          <span class="search-icon" aria-hidden="true"></span>
          <label class="visually-hidden" for="tool-search">Search tools</label>
          <input id="tool-search" type="search" placeholder="Search tools" autocomplete="off" disabled>
          <button id="clear-search" class="icon-button" type="button" aria-label="Clear search" title="Clear search" hidden>
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
      </section>

      <div class="catalog-layout">
        <aside class="catalog-filters" aria-label="Filter tools">
          <details id="category-filters" class="filter-section" open>
            <summary>Categories</summary>
            <fieldset disabled>
              <legend class="visually-hidden">Categories</legend>
              <div id="category-options" class="category-options"></div>
            </fieldset>
          </details>
          <details id="tag-filters" class="filter-section">
            <summary>Tags <span id="tag-selection-count"></span></summary>
            <fieldset disabled>
              <legend class="visually-hidden">Tags</legend>
              <div id="tag-options" class="tag-options"></div>
            </fieldset>
          </details>
        </aside>

        <section class="catalog-results" aria-label="Tool catalog" aria-busy="true">
          <div class="results-toolbar">
            <p id="catalog-status" role="status" aria-live="polite" aria-atomic="true">Loading tools&hellip;</p>
            <button id="clear-filters" class="clear-button" type="button" hidden>
              <span aria-hidden="true">&times;</span> Clear filters
            </button>
          </div>
          <div id="tool-grid" class="tool-grid"></div>
          <div id="no-results" class="empty-state" hidden>
            <h2>No tools found</h2>
          </div>
          <div id="catalog-error" class="empty-state" role="alert" hidden>
            <h2>Catalog unavailable</h2>
            <p>Please try again later.</p>
          </div>
          <noscript><p>JavaScript is required to load the tool catalog.</p></noscript>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container"><span>AI4Protein</span><a href="https://github.com/ai4proteins/ai4proteins.github.io" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">&nearr;</span></a></div>
    </footer>
  </body>
</html>
